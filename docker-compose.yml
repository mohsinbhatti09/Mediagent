services:
  mediagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediagent
    ports:
      - "8501:8501"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    volumes:
      - ./data/chroma:/app/data/chroma
      - huggingface_cache:/home/mediagent/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  huggingface_cache:
